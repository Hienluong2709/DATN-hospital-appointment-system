<div class="shell">
  <app-portal-topbar
    [portal]="portalKey"
    [isAuthenticated]="true"
    [breadcrumbLabel]="breadcrumbLabel" />

  <!-- BODY -->
  <div class="workspace" [class.collapsed]="!isExpanded" [class.no-sidebar]="isPatientPortal">
    @if (!isPatientPortal) {
      <!-- MINI SIDEBAR -->
      <aside class="rail">
        <div class="rail-menu">
          @for (item of visiblePrimaryMenu; track item.link) {
            <a
              class="rail-item"
              [routerLink]="item.link"
              routerLinkActive="active">
              <span class="material-symbols-outlined">{{ item.icon }}</span>
            </a>
          }
        </div>

        <button
          class="rail-toggle"
          type="button"
          [attr.aria-label]="isExpanded ? 'Thu gọn menu' : 'Mở rộng menu'"
          [title]="isExpanded ? 'Thu gọn menu' : 'Mở rộng menu'"
          (click)="toggleSidebar()">
          <span class="material-symbols-outlined">
            {{ isExpanded ? 'menu_open' : 'menu' }}
          </span>
        </button>
      </aside>

      <!-- MAIN SIDEBAR -->
      <aside class="subnav">
        <!-- <p class="subnav-title">Danh mục</p> -->

        @for (group of visibleMenuGroups; track group.key) {
          <section class="subnav-group">
            <h4>{{ group.title }}</h4>

            @for (item of group.items; track item.link) {
              <a
                class="subnav-item"
                [routerLink]="item.link"
                routerLinkActive="active">
                <span class="material-symbols-outlined">{{ item.icon }}</span>
                <span>{{ item.label }}</span>
              </a>
            }
          </section>
        }
      </aside>
    }

    <!-- CONTENT -->
    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
