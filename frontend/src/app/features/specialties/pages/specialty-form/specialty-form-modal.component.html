@if (isOpen) {
  <div class="modal-overlay" (click)="onOverlayClick()">
    <article class="modal-card" (click)="$event.stopPropagation()">
      <header class="modal-header">
        <h2>{{ isEditMode ? 'Cập nhật chuyên khoa' : 'Tạo chuyên khoa mới' }}</h2>
        <button class="icon-close" type="button" (click)="onCloseClick()" [disabled]="isSubmitting">x</button>
      </header>

      <form class="specialty-form" [formGroup]="form" (ngSubmit)="onSubmit()">
        <label>
          <span>Tên chuyên khoa</span>
          <input type="text" formControlName="name" placeholder="Ví dụ: Nội tổng quát" />
          @if (nameInvalid) {
            <small>Tên chuyên khoa là bắt buộc.</small>
          }
        </label>

        <label>
          <span>Mô tả</span>
          <textarea rows="4" formControlName="description" placeholder="Nhập mô tả ngắn cho chuyên khoa"></textarea>
        </label>

        <div class="form-actions">
          <button class="button-primary" type="submit" [disabled]="isSubmitting">
            {{ isSubmitting ? 'Dang xu ly...' : isEditMode ? 'Lưu cập nhật' : 'Thêm chuyên khoa' }}
          </button>
          <button class="button-secondary" type="button" (click)="onCloseClick()" [disabled]="isSubmitting">
            Đóng
          </button>
        </div>
      </form>
    </article>
  </div>
}
