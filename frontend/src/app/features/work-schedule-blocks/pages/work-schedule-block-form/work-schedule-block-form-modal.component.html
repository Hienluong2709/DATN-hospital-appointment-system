@if (isOpen) {
  <div class="modal-overlay" (click)="onOverlayClick()">
    <article class="modal-card" (click)="$event.stopPropagation()">
      <header class="modal-header">
        <h2>{{ isEditMode ? 'Cập nhật yêu cầu nghỉ' : (isDoctorView ? 'Đăng ký lịch nghỉ' : 'Tạo lịch nghỉ') }}</h2>
        <button class="icon-close" type="button" (click)="onCloseClick()" [disabled]="isSubmitting">x</button>
      </header>

      <form class="block-form" [formGroup]="form" (ngSubmit)="onSubmit()">
        <label>
          <span>Bác sĩ</span>
          <select formControlName="doctor_id">
            <option [ngValue]="0" disabled>Chọn bác sĩ</option>
            @for (doctor of doctors; track doctor.id) {
              <option [ngValue]="doctor.id">
                {{ doctor.User?.fullname || doctor.User?.username || 'Doctor ' + doctor.id }}
              </option>
            }
          </select>
          @if (doctorInvalid) {
            <small>Bác sĩ là bắt buộc.</small>
          }
        </label>

        <div class="grid-2">
          <label>
            <span>Ngày</span>
            <input type="date" formControlName="date" />
            @if (dateInvalid) {
              <small>Ngày là bắt buộc.</small>
            }
          </label>

          <label class="toggle-field">
            <span>Loại chặn</span>
            <label class="toggle-option">
              <input
                type="checkbox"
                formControlName="is_off"
                (change)="onOffToggle($any($event.target).checked)"
              />
              <span>Nghỉ cả ngày</span>
            </label>
          </label>
        </div>

        @if (!form.controls['is_off'].value) {
          <div class="grid-2">
            <label>
              <span>Giờ bắt đầu</span>
              <input type="time" formControlName="start_time" />
            </label>

            <label>
              <span>Giờ kết thúc</span>
              <input type="time" formControlName="end_time" />
            </label>
          </div>

          @if (timeInvalid) {
            <small>Giờ bắt đầu phải nhỏ hơn giờ kết thúc.</small>
          }
        } @else {
          <p class="info-text">Chế độ này sẽ chặn cả ngày và không cần nhập khung giờ.</p>
        }

        <label>
          <span>Lý do</span>
          <textarea rows="3" formControlName="reason" placeholder="Ví dụ: họp khoa, nghỉ phép, bảo trì..."></textarea>
        </label>

        <div class="form-actions">
          <button class="button-primary" type="submit" [disabled]="isSubmitting || !doctors.length">
            {{ isSubmitting ? 'Đang xử lý...' : isEditMode ? 'Gửi lại yêu cầu' : (isDoctorView ? 'Gửi yêu cầu nghỉ' : 'Tạo lịch nghỉ') }}
          </button>
          <button class="button-secondary" type="button" (click)="onCloseClick()" [disabled]="isSubmitting">
            Đóng
          </button>
        </div>
      </form>
    </article>
  </div>
}
