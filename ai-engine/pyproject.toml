[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datn-ai-engine"
version = "0.1.0"
description = "Queue wait prediction engine for DATN"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "catboost>=1.2.5",
  "fastapi>=0.115.0",
  "joblib>=1.4.2",
  "numpy>=1.26.4",
  "pandas>=2.2.2",
  "scikit-learn>=1.5.1",
  "uvicorn[standard]>=0.30.0",
]

[project.scripts]
ai-engine-train = "ai_engine.train:main"
ai-engine-predict = "ai_engine.predict:main"
ai-engine-serve = "ai_engine.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
